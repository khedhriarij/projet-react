name: mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'  # Changez cette ligne

dependencies:
  flutter:
    sdk: flutter

  # Firebase - utilisez ces versions compatibles
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.3
  cloud_firestore: ^4.14.0
  shared_preferences: ^2.2.2

  # State Management
  provider: ^6.1.1

  # Supprimez flutter_riverpod pour éviter les conflits
  # flutter_riverpod: ^3.0.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/image.png
    - assets/images/logo.png
    - assets/images/